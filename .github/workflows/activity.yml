name: Update contribution graph

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/update_activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate graph from GitHub
        run: python3 scripts/update_activity.py
      - name: Save updated graph
        run: |
          git add assets/activity.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update contribution activity'
          git push
